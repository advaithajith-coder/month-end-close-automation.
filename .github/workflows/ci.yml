name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Python engine tests (incl. JS/Python parity and Excel parity)
        run: python -m pytest
      - name: Browser engine period-lock tests
        run: node --test tests/test_lock.cjs
